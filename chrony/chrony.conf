# Use stable servers
server ntp2.vniiftri.ru iburst minpoll 6 maxpoll 10
pool 0.ru.pool.ntp.org maxsources 1 iburst minpoll 6 maxpoll 10
pool 1.ru.pool.ntp.org maxsources 1 iburst minpoll 6 maxpoll 10
pool 0.ubuntu.pool.ntp.org iburst maxsources 1 minpoll 6 maxpoll 10
pool 1.ubuntu.pool.ntp.org iburst maxsources 1 minpoll 6 maxpoll 10

# Fast correction on boot
makestep 1.0 3

# Allow high latency / jitter (GSM)
maxupdateskew 100.0

# Sync system clock to RTC
rtcsync

# Logging
logdir /var/log/chrony
